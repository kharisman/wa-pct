version: 2.1

jobs:
  build-debug-apk:
    docker:
      - image: cimg/android:2024.01.1   # sudah ada Android SDK + JDK 17
    working_directory: ~/project
    steps:
      - checkout
      - restore_cache:
          keys:
            - gradle-v1-{{ checksum "android/app/build.gradle" }}
            - gradle-v1-
      - run:
          name: Tulis google-services.json (dari env GOOGLE_SERVICES_JSON_BASE64)
          command: |
            if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
              echo "ERROR: set env var GOOGLE_SERVICES_JSON_BASE64 di CircleCI Project Settings."
              echo "Isi: base64 dari file google-services.json Firebase (base64 -w0 google-services.json)."
              exit 1
            fi
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
      - run:
          name: Build debug APK
          command: cd android && ./gradlew assembleDebug --no-daemon --stacktrace
      - run:
          name: Daftar APK hasil build
          command: find android/app/build/outputs -name '*.apk' -print
      - save_cache:
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper
          key: gradle-v1-{{ checksum "android/app/build.gradle" }}
      - store_artifacts:
          path: android/app/build/outputs/apk/debug
          destination: apk

workflows:
  android:
    jobs:
      - build-debug-apk
