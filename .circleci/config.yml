version: 2.1

jobs:
  build-debug-apk:
    docker:
      - image: cimg/android:2024.01.1   # sudah ada Android SDK + JDK 17
    working_directory: ~/project
    steps:
      - checkout
      - restore_cache:
          keys:
            - gradle-v1-{{ checksum "android/app/build.gradle" }}
            - gradle-v1-
      - run:
          name: Build debug APK
          command: cd android && ./gradlew assembleDebug --no-daemon --stacktrace
      - save_cache:
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper
          key: gradle-v1-{{ checksum "android/app/build.gradle" }}
      - store_artifacts:
          path: android/app/build/outputs/apk/debug/app-debug.apk
          destination: app-debug.apk

workflows:
  android:
    jobs:
      - build-debug-apk
